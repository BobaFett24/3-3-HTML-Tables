<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Baguette with butter</td>
                    <td>Baguette slices and salted butter</td>
                    <td>$5</td>
                </tr>
                 <tr>
                    <td>Pasta with tomato sauce</td>
                    <td>Linguine pasta and tomato basil sauce</td>
                    <td>$12</td>
                </tr>
                 <tr>
                    <td>Chocolate lava cake</td>
                    <td>Chocolate, flour, sugar, butter, eggs, salt </td>
                    <td>$6</td>
                </tr>
             
            </tbody>
        </table>


    </body>
</html>
